# --- GENERAL SETTINGS ---
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# --- BACKGROUND ---
background {
    monitor =
    path = ~/Downloads/lock.jpg
    blur_passes =1.5
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# --- CLOCK (Pinned Higher) ---
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 65  # Slightly smaller to fit laptop screens better
    font_family = JetBrainsMono Nerd Font
    font_weight = bold
    
    # Pinned to Top
    position = 0, -30
    halign = center
    valign = top
    
    shadow_passes = 5
    shadow_size = 10
}

# --- DATE (Immediately below Clock) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    font_weight = bold
    
    # Pinned to Top
    position = 0, -130
    halign = center
    valign = top
}

# --- PHOTO CARD (Shifted Upwards) ---
image {
    monitor =
    path = ~/Downloads/profile.jpg
    size = 220 # Slightly smaller to save space
    
    rounding = 20
    border_size = 3
    border_color = rgba(137, 180, 250, 0.8) # Cosmic Blue Border
    
    # MOVED UP: Starts above the center line to leave room below
    position = 0, 50
    halign = center
    valign = center
    
    shadow_passes = 5
    shadow_size = 20
    shadow_color = rgba(137, 180, 250, 0.5)
}

# --- NAME (Directly below photo) ---
label {
    monitor =
    text = COMMANDER BRATHAP S
    color = rgba(255, 255, 255, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    font_weight = bold
    letter_spacing = 2
    
    # Positioned just below the photo
    position = 0, -100
    halign = center
    valign = center
}

# --- INPUT FIELD (Safe Zone) ---
input-field {
    monitor =
    size = 220, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(137, 180, 250, 0.8)
    inner_color = rgba(10, 10, 18, 0.9)
    font_color = rgb(255, 255, 255)
    
    fade_on_empty = false
    placeholder_text = <i><span foreground="##a6adc8">ENTER CODE</span></i>
    
    hide_input = false
    
    # MOVED UP: This ensures it never hits the bottom text
    position = 0, -160
    halign = center
    valign = center
}

# --- BOTTOM STATUS (Pinned to very bottom) ---
label {
    monitor =
    text = cmd[update:60000] echo "  UPTIME: $(uptime -p | sed 's/up //')   |   POWER: $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null || echo "100")%"
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    
    # Pinned to Bottom Edge
    position = 0, 20
    halign = center
    valign = bottom
}
