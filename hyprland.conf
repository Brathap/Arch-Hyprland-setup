env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

#--- MONITOR ---
monitor=,preferred,auto,1

# Start the Clipboard Manager silently
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

exec-once = ~/.config/hypr/scripts/wallpaper_engine.sh
# Start VNC Server (Remote Access) automatically
#exec-once = sleep 5 &&  wayvnc 0.0.0.0
exec-once = sleep 3 && libinput-gestures-setup start

# --- STARTUP ---
# Starts the wallpaper engine
exec-once = swww-daemon
# Starts the Top Bar
exec-once = sleep 2 && waybar

# --- INPUT ---
input {
    kb_layout = us
    follow_mouse = 1
}

# --- THE CYBERPUNK LOOK ---
general {
    col.active_border = rgb(00ff99) rgb(00ccff) rgb(cc00ff) 45deg
    col.inactive_border = rgb(595959)
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # NEON CYAN GLOW BORDER
    col.active_border = rgba(00f0ffee) rgba(0077beee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 5
    dim_inactive = true
    dim_strength = 0.3
    # GLASS / BLUR EFFECT
    blur {
        enabled = false
        size = 1
        passes = 1
	new_optimizations = true
    }
}

misc {
    vfr = true                  # Variable Frame Rate: Lowers FPS when idle (Huge battery saver)
    vrr = 1                     # Variable Refresh Rate: Adaptive sync (0=off, 1=on, 2=fullscreen only)
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = true       # Hides terminal when you open an app from it (Cleaner)
}

animations {
    enabled = yes
    bezier = spiderverse, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, spiderverse, popin 80%
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = workspaces, 1, 5, spiderverse, slide
    # Use the standard smooth style (default), but make it FAST.
    # The '2' means it finishes very quickly.
    
    animation = windows, 1, 3, default,popin 80%
    animation = workspaces, 1, 6, default,slide
}

# --- KEYBINDINGS ---
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive, 
bind = $mainMod, B, exit, 
bind = $mainMod, E, exec, thunar
bind = $mainMod, T, togglefloating, 
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, V, exec, ~/.config/hypr/scripts/rofi_center.sh
# Super + A opens the App Grid
bind = $mainMod, A, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi
# Press SUPER + X to open the Clipboard History
bind = SUPER, X, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Volume Control Keys
# binde = allows you to hold the key down to repeat
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
# Press SUPER + M to bring back the last notification (History Pop)
bind = SUPER, M, exec, swaync-client -t -sw

#Typer command
bind = $mainMod, S, exec, python ~/Documents/Typer/autotyper.py

# Move focus
bind = ctrl, left, movefocus, l
bind = ctrl, right, movefocus, r
bind = ctrl, up, movefocus, u
bind = ctrl, down, movefocus, d

# Screenshot a region (Press PrintScreen -> Select area -> It copies to clipboard)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# Screenshot full screen (Press Shift + PrintScreen -> Copies to clipboard)
bind = SHIFT, Print, exec, grim - | wl-copy

# Toggle Fullscreen/Maximize (Super + F)
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, Z, fullscreen
# Toggle Floating/Minimize (Super + D)
# New binding runs the script to fix the visible window bug
bind = $mainMod, D, exec, ~/.config/hypr/scripts/minimize_toggle.sh
# Key for Lock Screen
bind = $mainMod, L, exec, hyprlock

# --- MOUSE CONTROLS ---
# Move Window: Hold Super + Left Mouse Button and Drag
bindm = $mainMod, mouse:272, movewindow
# Resize Window: Hold Super + Right Mouse Button and Drag
bindm = $mainMod, mouse:273, resizewindow


# Float the Bluetooth Menu
windowrulev2 = float, class:^(bt_menu)$
windowrulev2 = size 600 400, class:^(bt_menu)$
windowrulev2 = center, class:^(bt_menu)$

# --- FIX POPUPS & DIALOGS ---
# Make file dialogs float and center
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Select a File)(.*)$
windowrulev2 = float, title:^(Choose wallpaper)(.*)$
windowrulev2 = float, title:^(Open Folder)(.*)$
windowrulev2 = float, title:^(Save As)(.*)$
windowrulev2 = float, title:^(Library)(.*)$
windowrulev2 = float, title:^(File Upload)(.*)$

# Set a nice size for them
windowrulev2 = size 800 600, title:^(File Upload)(.*)$
windowrulev2 = center, title:^(File Upload)(.*)$

